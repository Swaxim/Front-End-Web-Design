<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - CS2 Hub</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <script>
        if (document.cookie.includes("themePreference=light")) {
            document.body.classList.add("light-theme");
        }
    </script>

    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark px-4 py-2">
        <div class="container-fluid">

            <a class="navbar-brand fw-bold text-accent" href="home.html">
                CS2 HUB
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">

                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse justify-content-between" id="navbarNav">

                <ul class="navbar-nav me-auto">

                    <li class="nav-item">
                        <a class="nav-link fw-semibold" href="tournaments.html">
                            Tournaments
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link fw-semibold" href="teams.html">
                            Teams
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link fw-semibold" href="gallery.html">
                            Gallery
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link fw-semibold" href="about.html">
                            About
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link fw-semibold" href="contact.html">
                            Contact
                        </a>
                    </li>

                </ul>

                <a href="login.html" class="btn btn-primary btn-sm">
                    Login
                </a>

            </div>
        </div>
    </nav>


    <!-- Login Section -->
    <main class="login-page">

        <div class="container">
            <div class="row justify-content-center">

                <div class="col-lg-5 col-md-7">

                    <div class="login-card">

                        <div class="text-center mb-4">

                            <span class="section-label">
                                MEMBER ACCESS
                            </span>

                            <h1 class="login-title">
                                Welcome Back
                            </h1>

                            <p class="login-description">
                                Sign in to personalise your CS2 Hub experience.
                            </p>

                        </div>


                        <form id="loginForm">

                            <!-- Username -->
                            <div class="mb-3">

                                <label for="username" class="form-label">
                                    Username
                                </label>

                                <input type="text" id="username" class="form-control" placeholder="Enter your username"
                                    required>

                            </div>


                            <!-- Password -->
                            <div class="mb-3">

                                <label for="password" class="form-label">
                                    Password
                                </label>

                                <input type="password" id="password" class="form-control"
                                    placeholder="Enter your password" required>

                            </div>


                            <!-- Remember Username -->
                            <div class="form-check mb-4">

                                <input class="form-check-input" type="checkbox" id="rememberUsername">

                                <label class="form-check-label" for="rememberUsername">

                                    Remember my username

                                </label>

                            </div>


                            <!-- Message -->
                            <div id="loginMessage"></div>


                            <!-- Login Button -->
                            <button type="submit" class="btn btn-primary w-100">

                                Login

                            </button>

                        </form>

                    </div>
                </div>

            </div>
        </div>

    </main>


    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Login JavaScript -->
    <script src="login.js"></script>

</body>

</html>
