<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teams - CS2 Hub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark px-4 py-2">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold text-accent" href="index.html">CS2 HUB</a>
            <div class="navbar-nav me-auto">
                <a class="nav-link fw-semibold" href="tournaments.html">Tournaments</a>
                <a class="nav-link active fw-semibold" href="teams.html">Teams</a>
            </div>
            <span class="badge bg-secondary">CS2 World Rankings</span>
        </div>
    </nav>

    <div class="container my-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3 class="fw-bold text-light mb-0">World Team Standings</h3>

            <!-- Region Filter Badges -->
            <div class="btn-group" role="group" id="region-filter">
                <button class="btn btn-sm btn-outline-primary active" data-region="All">All Regions</button>
                <button class="btn btn-sm btn-outline-primary" data-region="Europe">Europe</button>
                <button class="btn btn-sm btn-outline-primary" data-region="Americas">Americas</button>
            </div>
        </div>

        <!-- Table Layout -->
        <div class="table-responsive bg-dark-card p-3 rounded">
            <table class="table table-dark-custom align-middle mb-0">
                <thead>
                    <tr>
                        <th scope="col" style="width: 80px;">Rank</th>
                        <th scope="col">Team</th>
                        <th scope="col">Base Location</th>
                        <th scope="col">Active Roster</th>
                    </tr>
                </thead>
                <tbody id="team-table-body"></tbody>
            </table>
        </div>
    </div>

    <!-- Detail View Modal with Interactive Flash Cards -->
    <div class="modal fade" id="teamModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content bg-dark-card text-light border-secondary">
                <div class="modal-header border-secondary">
                    <h5 class="modal-title text-accent fw-bold" id="modalTeamName"></h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p><strong class="text-secondary">Base Location:</strong> <span id="modalTeamLoc"
                            class="text-light"></span></p>
                    <p><strong class="text-secondary">Overview:</strong> <span id="modalTeamDesc"
                            class="text-light"></span></p>

                    <h6 class="text-accent mt-4 mb-3">Active Roster (Player Cards)</h6>
                    <!-- Grid of Interactive Player Flash Cards -->
                    <div id="player-cards-grid" class="row g-3"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="data.json"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        $(document).ready(function () {
            // Cookie Requirement
            document.cookie = "last_page=teams.html; path=/";

            function renderTeams(selectedRegion = "All") {
                const tbody = $("#team-table-body");
                tbody.empty();

                let filtered = siteData.teams;
                if (selectedRegion !== "All") {
                    filtered = filtered.filter(t => t.region === selectedRegion);
                }

                filtered.forEach(t => {
                    const playerBadges = t.players.map(p => `<span class="badge badge-roster me-1">${p.handle}</span>`).join('');
                    const rowHtml = `
            <tr data-id="${t.id}">
              <td class="fw-bold text-accent">#${t.rank}</td>
              <td>
                <img src="${t.logo}" alt="${t.name}" class="rounded me-2" width="32" height="32">
                <span class="fw-semibold text-light">${t.name}</span>
              </td>
              <td class="text-light">${t.location}</td>
              <td>${playerBadges}</td>
            </tr>
          `;
                    tbody.append(rowHtml);
                });
            }

            renderTeams();

            // Region Filter Click Event
            $("#region-filter button").click(function () {
                $("#region-filter button").removeClass("active");
                $(this).addClass("active");
                renderTeams($(this).data("region"));
            });

            // Show Details & Generate Flash Cards inside Modal
            $(document).on("click", "#team-table-body tr", function () {
                const id = $(this).data("id");
                const team = siteData.teams.find(t => t.id === id);

                if (team) {
                    $("#modalTeamName").text(team.name);
                    $("#modalTeamLoc").text(team.location);
                    $("#modalTeamDesc").text(team.description);

                    const grid = $("#player-cards-grid");
                    grid.empty();

                    team.players.forEach(p => {
                        const cardHtml = `
              <div class="col-md-4">
                <div class="player-card">
                  <div class="d-flex justify-content-between align-items-center mb-2">
                    <span class="player-handle">${p.handle}</span>
                    <span class="badge bg-secondary">${p.country}</span>
                  </div>
                  <div class="player-stat mb-1">Role: <strong class="text-light">${p.role}</strong></div>
                  <div class="player-stat mb-1">HLTV Rating: <strong class="text-accent">${p.rating}</strong></div>
                  <div class="player-stat">Fav Weapon: <span class="text-light">${p.weapon}</span></div>
                </div>
              </div>
            `;
                        grid.append(cardHtml);
                    });

                    const teamModal = new bootstrap.Modal(document.getElementById('teamModal'));
                    teamModal.show();
                }
            });
        });
    </script>
</body>

</html>
