<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tournaments - CS2 Hub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Match Countdown Header -->
    <div class="ticker-banner py-2 px-4 text-center text-light">
        🔥 <strong>NEXT MATCH:</strong> <span id="ticker-teams"></span> —
        <span class="text-accent fw-bold" id="ticker-countdown">00h 00m 00s</span>
        <span class="badge bg-secondary ms-2" id="ticker-event"></span>
    </div>

    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark px-4 py-2">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold text-accent" href="index.html">CS2 HUB</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse justify-content-between" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link active fw-semibold" href="tournaments.html">Tournaments</a>
                    </li>
                    <li class="nav-item"><a class="nav-link fw-semibold" href="teams.html">Teams</a></li>
                </ul>

                <div class="d-flex align-items-center gap-3">
                    <input type="text" id="global-search"
                        class="form-control form-control-sm bg-dark text-light border-secondary"
                        placeholder="Search events..." style="width: 200px;">
                    <span class="badge bg-secondary">Region: Global</span>
                </div>
            </div>
        </div>
    </nav>

    <div class="container my-4">
        <!-- Analytical Stat Counters -->
        <div class="row g-3 mb-4 text-center">
            <div class="col-md-4">
                <div class="bg-dark-card p-3">
                    <small class="text-secondary d-block">TOTAL PRIZE POOL</small>
                    <h4 class="text-accent fw-bold mb-0" id="stat-prize"></h4>
                </div>
            </div>
            <div class="col-md-4">
                <div class="bg-dark-card p-3">
                    <small class="text-secondary d-block">ACTIVE EVENTS</small>
                    <h4 class="text-light fw-bold mb-0" id="stat-events"></h4>
                </div>
            </div>
            <div class="col-md-4">
                <div class="bg-dark-card p-3">
                    <small class="text-secondary d-block">TRACKED TEAMS</small>
                    <h4 class="text-light fw-bold mb-0" id="stat-teams"></h4>
                </div>
            </div>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3 class="fw-bold text-light mb-0">Events Directory</h3>
            <div class="btn-group" role="group">
                <button id="btn-upcoming" class="btn btn-sm btn-outline-primary active">Upcoming</button>
                <button id="btn-past" class="btn btn-sm btn-outline-primary">Past</button>
            </div>
        </div>

        <!-- Tournament List Container -->
        <div id="tournament-list" class="d-flex flex-column gap-3"></div>
    </div>

    <script src="data.json"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        $(document).ready(function () {
            // Cookie Requirement
            document.cookie = "last_page=tournaments.html; path=/";

            // Load Stat Banner
            $("#stat-prize").text(siteData.stats.totalPrize);
            $("#stat-events").text(siteData.stats.activeTournaments);
            $("#stat-teams").text(siteData.stats.trackedTeams);

            // Countdown Timer Logic
            const match = siteData.upcomingMatch;
            $("#ticker-teams").text(`${match.teamA} vs ${match.teamB}`);
            $("#ticker-event").text(match.event);

            function updateCountdown() {
                const now = new Date().getTime();
                const diff = match.timestamp - now;
                if (diff > 0) {
                    const hrs = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                    const mins = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                    const secs = Math.floor((diff % (1000 * 60)) / 1000);
                    $("#ticker-countdown").text(`${hrs}h ${mins}m ${secs}s`);
                }
            }
            setInterval(updateCountdown, 1000);

            // Session Storage Filter Requirement
            let currentFilter = sessionStorage.getItem("tournamentFilter") || "upcoming";

            function updateActiveButton() {
                if (currentFilter === "upcoming") {
                    $("#btn-upcoming").addClass("active");
                    $("#btn-past").removeClass("active");
                } else {
                    $("#btn-past").addClass("active");
                    $("#btn-upcoming").removeClass("active");
                }
            }

            function renderTournaments(filterText = "") {
                const container = $("#tournament-list");
                container.empty();

                let filtered = siteData.tournaments.filter(t => t.status === currentFilter);
                if (filterText.trim() !== "") {
                    filtered = filtered.filter(t => t.name.toLowerCase().includes(filterText.toLowerCase()) || t.location.toLowerCase().includes(filterText.toLowerCase()));
                }

                // Local Storage Requirement
                const savedFavorites = JSON.parse(localStorage.getItem("fav_tournaments") || "[]");

                filtered.forEach(t => {
                    const isFav = savedFavorites.includes(t.id);
                    let subInfo = t.status === "upcoming"
                        ? `<div><small class="text-secondary d-block">Attending Teams</small>${t.teams.map(team => `<img src="${team.logo}" class="rounded-circle me-1" width="24" height="24" title="${team.name}">`).join('')}</div>`
                        : `<div><small class="text-secondary d-block">Results</small><span class="badge bg-success me-1">🥇 ${t.winner}</span><span class="badge bg-secondary">🥈 ${t.runnerUp}</span></div>`;

                    const html = `
            <div class="list-row-item p-3" data-id="${t.id}">
              <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3">
                <div class="d-flex align-items-center gap-3">
                  <img src="${t.logo}" class="rounded" width="48" height="48">
                  <div>
                    <h5 class="mb-1 text-light tourney-title">${t.name}</h5>
                    <small class="text-secondary">${t.date} | 📍 ${t.location}</small>
                  </div>
                </div>
                <div class="d-flex align-items-center gap-4">
                  ${subInfo}
                  <div class="text-md-end">
                    <small class="text-secondary d-block">Prize Pool</small>
                    <strong class="text-accent">${t.prize}</strong>
                  </div>
                  <button class="btn btn-sm ${isFav ? 'btn-warning' : 'btn-outline-secondary'} fav-btn" data-id="${t.id}">★</button>
                </div>
              </div>
              
              <div class="tourney-details-panel" id="panel-${t.id}">
                <strong class="text-accent d-block mb-1">Prize Pool Distribution:</strong>
                <p class="mb-0 text-light"><small>${t.prizeBreakdown}</small></p>
              </div>
            </div>
          `;
                    container.append(html);
                });
            }

            updateActiveButton();
            renderTournaments();

            $("#btn-upcoming").click(function () {
                currentFilter = "upcoming";
                sessionStorage.setItem("tournamentFilter", "upcoming");
                updateActiveButton();
                renderTournaments($("#global-search").val());
            });

            $("#btn-past").click(function () {
                currentFilter = "past";
                sessionStorage.setItem("tournamentFilter", "past");
                updateActiveButton();
                renderTournaments($("#global-search").val());
            });

            // Expandable Details View on Row Click
            $(document).on("click", ".list-row-item", function (e) {
                if ($(e.target).hasClass("fav-btn")) return;
                const id = $(this).data("id");
                $(`#panel-${id}`).slideToggle(200);
            });

            // Search Filtering
            $("#global-search").on("input", function () {
                renderTournaments($(this).val());
            });

            // Bookmarking Toggle (localStorage)
            $(document).on("click", ".fav-btn", function (e) {
                e.stopPropagation();
                const id = $(this).data("id");
                let savedFavorites = JSON.parse(localStorage.getItem("fav_tournaments") || "[]");
                savedFavorites = savedFavorites.includes(id) ? savedFavorites.filter(i => i !== id) : [...savedFavorites, id];
                localStorage.setItem("fav_tournaments", JSON.stringify(savedFavorites));
                renderTournaments($("#global-search").val());
            });
        });
    </script>
</body>

</html>
